name=ArcadeCPU_i8080
version=0.1.0
author=intarga (i8080e), ported via shotto42/invaders and adafruit/invaders_pico
maintainer=arcade_arduino project
sentence=Portable Intel 8080 CPU interpreter (MIT), unchanged from the invaders_pico reference port.
paragraph=No hardware dependencies -- registers, flat memory array, exec_opcode()/interrupt(). A Machine library installs port_in/port_out callbacks on Cpu_state (see i8080.h) and drives exec_opcode()/interrupt() each frame. Those were extern globals named read_port()/write_port() until two i8080 machines needed to coexist in one build; the per-instance pointers match the shape ArcadeCPU_Z80, _M6502 and _MCS48 already use.
category=Other
url=https://github.com/intarga/i8080e
architectures=*
