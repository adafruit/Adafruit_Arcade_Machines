name=Adafruit Arcade Machines
version=2.11.0
author=John Park
maintainer=Adafruit <info@adafruit.com>
sentence=Classic arcade machines and consoles emulated on the Adafruit Fruit Jam (RP2350B) and Feather ESP32 V2, under the Arduino framework.
paragraph=Seven arcade games -- Space Invaders, Lunar Rescue, Pac-Man, Ms. Pac-Man, Galaga, Donkey Kong and Burger Time -- and the Game Boy console (the SD card is the cartridge, with battery saves and colour palettes), with USB gamepad support on the Fruit Jam. Each game is built as a SAMP (Single Arcade Machine Port) composition of three independent axes: a CPU core (src/cpu: i8080, Z80, 6502, MCS-48), a board-agnostic machine layer (src/machines) holding one game's memory map, video, audio and input wiring, and a board backend (src/boards) implementing the ArcadeHAL contracts. Open an example, add a microSD card with legally-obtained ROMs, and set Tools > Optimize to -O2/-O3 -- the default -Os is not fast enough and shows up as a red screen. Every hardware fact is cited against MAME's own driver sources; see DEVNOTES.md for the full hardware bring-up record.
category=Other
url=https://github.com/adafruit/Adafruit_Arcade_Machines
architectures=rp2040,esp32
includes=Adafruit_Arcade_Machines.h
depends=PicoDVI - Adafruit Fork, SdFat - Adafruit Fork, Adafruit TLV320 I2S, Adafruit ILI9341, Adafruit TinyUSB Library, Pico PIO USB
# Archive the library so a sketch links only the objects it references.
# Requires every file under src/ to have a unique name -- see DEVNOTES #126.
dot_a_linkage=true
