version = 1

# build_opt.h CANNOT CARRY A HEADER, which is the whole reason this file
# exists. The Arduino builder passes it to the compiler as an `@file`, whose
# contents are tokenised as command-line arguments rather than parsed as C --
# so an `// SPDX-FileCopyrightText:` line does not become a comment, it
# becomes four bogus flags and the build fails. Each of these files is a
# single optimisation flag and nothing else.
#
# This is the mechanism REUSE provides for exactly that case, and it is what
# keeps `reuse lint` at 100% now that every ESP32 example ships one.
[[annotations]]
path = "examples/Games/*_featheresp32/build_opt.h"
SPDX-FileCopyrightText = "2026 John Park for Adafruit Industries"
SPDX-License-Identifier = "MIT"

# Vendored Game Boy core (src/machines/gb/core/VENDORED.md). These files are
# kept byte-identical to upstream, so their licensing is declared here rather
# than by editing their headers. All three are MIT: peanut_gb.h says so in its
# header, including for the parts it marks as taken from SameBoy; minigb_apu.c
# (vendored as .c.inc) says so in its header, and minigb_apu's README says MIT
# for the project, which covers minigb_apu.h.
[[annotations]]
path = "src/machines/gb/core/peanut_gb.h"
SPDX-FileCopyrightText = ["2018-2023 Mahyar Koshkouei", "2015-2019 Lior Halphon"]
SPDX-License-Identifier = "MIT"

[[annotations]]
