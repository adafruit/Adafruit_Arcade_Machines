version = 1

# build_opt.h CANNOT CARRY A HEADER, which is the whole reason this file
# exists. The Arduino builder passes it to the compiler as an `@file`, whose
# contents are tokenised as command-line arguments rather than parsed as C --
# so an `// SPDX-FileCopyrightText:` line does not become a comment, it
# becomes four bogus flags and the build fails. Each of these files is a
# single optimisation flag and nothing else.
#
# This is the mechanism REUSE provides for exactly that case, and it is what
# keeps `reuse lint` at 100% now that every ESP32 example ships one.
[[annotations]]
path = "examples/Games/*_featheresp32/build_opt.h"
SPDX-FileCopyrightText = "2026 John Park for Adafruit Industries"
SPDX-License-Identifier = "MIT"

# Vendored Game Boy core (src/machines/gb/core/VENDORED.md). Their headers are
# left as upstream wrote them, so their licensing is declared here instead;
# peanut_gb.h also carries one Adafruit patch (peanut_gb-halt-yield.patch). All three are MIT: peanut_gb.h says so in its
# header, including for the parts it marks as taken from SameBoy; minigb_apu.c
# (vendored as .c.inc) says so in its header, and minigb_apu's README says MIT
# for the project, which covers minigb_apu.h.
[[annotations]]
path = "src/machines/gb/core/peanut_gb.h"
SPDX-FileCopyrightText = ["2018-2023 Mahyar Koshkouei", "2015-2019 Lior Halphon", "2026 John Park for Adafruit Industries"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["src/machines/gb/core/minigb_apu.h", "src/machines/gb/core/minigb_apu.c.inc"]
SPDX-FileCopyrightText = ["2019 Mahyar Koshkouei", "2017 Alex Baines"]
SPDX-License-Identifier = "MIT"

# USB gamepad captures (extras/tools/usb_gamepad_test/captures/): serial logs
# recorded from our own self-test (examples/SelfTest/usb_gamepad_test_fruitjam)
# with real controllers plugged in, used as the decoder test's input. Plain
# log text, so no header can be added without breaking the replay.
[[annotations]]
path = "extras/tools/usb_gamepad_test/captures/*.log"
SPDX-FileCopyrightText = "2026 John Park for Adafruit Industries"
SPDX-License-Identifier = "MIT"

# The NES spike's patches to nofrendo (extras/tools/nes_test/patches/): our
# change plus a few lines of nofrendo's own code as diff context, so they
# carry nofrendo's licence, version 2 of the GNU Library GPL.
[[annotations]]
path = "extras/tools/nes_test/patches/*.patch"
SPDX-FileCopyrightText = ["1998-2000 Matthew Conte", "2026 John Park for Adafruit Industries"]
SPDX-License-Identifier = "LGPL-2.0-only"
